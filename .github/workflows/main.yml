name: Send emails daily
on:
  workflow_dispatch:
    inputs:
      send_empty:
        description: Send a diagnostic email even when there are no new papers
        type: boolean
        default: false
  schedule:
    # 14:17 Asia/Shanghai, after the arXiv RSS midnight-EST refresh.
    # Avoid the start of the hour, when scheduled Actions are more likely to queue.
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: arxiv-daily-email
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        id: digest
        shell: bash
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          SEND_EMPTY: ${{ inputs.send_empty && 'true' || 'false' }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          args=()
          if [[ "$SEND_EMPTY" == "true" ]]; then
            args+=(executor.send_empty=true)
          fi
          uv run src/zotero_arxiv_daily/main.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/arxiv-daily.log"

      - name: Summarize email delivery
        if: always()
        shell: bash
        env:
          DIGEST_OUTCOME: ${{ steps.digest.outcome }}
        run: |
          log="$RUNNER_TEMP/arxiv-daily.log"
          {
            echo "## arXiv daily email"
            echo
            if [[ "$DIGEST_OUTCOME" != "success" ]]; then
              echo "**Run failed.** The email digest did not finish; check the Run script logs."
            elif grep -qF "Email sent successfully" "$log"; then
              echo "**Email sent successfully.**"
            elif grep -qF "No new papers found. No email will be sent." "$log"; then
              echo "**No email sent:** the configured feeds returned no new papers."
            else
              echo "**Email delivery not confirmed.** Check the Run script logs."
            fi
            echo
            echo "Scheduled check: daily at 14:17 Asia/Shanghai (06:17 UTC). GitHub may delay the start."
          } >> "$GITHUB_STEP_SUMMARY"
