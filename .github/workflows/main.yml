name: Send emails daily
on:
  workflow_dispatch:
    inputs:
      send_empty:
        description: Send a diagnostic email even when there are no new papers
        type: boolean
        default: false
      validate_pipeline:
        description: Validate the complete pipeline using one real paper
        type: boolean
        default: false
  schedule:
    # 14:17 Asia/Shanghai, after the arXiv RSS midnight-EST refresh.
    # Avoid the start of the hour, when scheduled Actions are more likely to queue.
    - cron: '17 6 * * *'
    # Backstop at 20:17 Asia/Shanghai. GitHub can delay or silently skip a
    # scheduled event; the second attempt still only emails papers that were
    # not delivered yet, so a normal day produces no duplicate email.
    - cron: '17 12 * * *'

permissions:
  contents: read

concurrency:
  group: arxiv-daily-email
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Restore paper delivery history
        uses: actions/cache/restore@v5
        with:
          path: .state/delivered-papers.json
          key: arxiv-delivery-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: arxiv-delivery-v1-

      - name: Run script
        id: digest
        shell: bash
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          SEND_EMPTY: ${{ inputs.send_empty && 'true' || 'false' }}
          VALIDATE_PIPELINE: ${{ inputs.validate_pipeline && 'true' || 'false' }}
          ARXIV_DIAGNOSTIC: ${{ inputs.validate_pipeline && 'true' || 'false' }}
          EMAIL_SUBJECT_PREFIX: ${{ inputs.validate_pipeline && '[TEST] ' || '' }}
          DELIVERY_STATE_FILE: ${{ github.workspace }}/.state/delivered-papers.json
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          args=()
          if [[ "$SEND_EMPTY" == "true" ]]; then
            args+=(executor.send_empty=true)
          fi
          if [[ "$VALIDATE_PIPELINE" == "true" ]]; then
            args+=(executor.debug=true executor.max_paper_num=1)
          fi
          uv run src/zotero_arxiv_daily/main.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/arxiv-daily.log"

      - name: Save paper delivery history
        if: always() && hashFiles('.state/delivered-papers.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .state/delivered-papers.json
          key: arxiv-delivery-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarize email delivery
        if: always()
        shell: bash
        env:
          DIGEST_OUTCOME: ${{ steps.digest.outcome }}
        run: |
          log="$RUNNER_TEMP/arxiv-daily.log"
          {
            echo "## arXiv daily email"
            echo
            if [[ "$DIGEST_OUTCOME" != "success" ]]; then
              echo "**Run failed.** The email digest did not finish; check the Run script logs."
            elif grep -qF "Email sent successfully" "$log"; then
              echo "**Email sent successfully.**"
            elif grep -qF "No new papers found. No email will be sent." "$log"; then
              echo "**No email sent:** no new announcement was present in the configured feeds."
              echo "arXiv can defer announcement batches for maintenance or holidays. See https://status.arxiv.org/."
            else
              echo "**Email delivery not confirmed.** Check the Run script logs."
            fi
            echo
            echo "Scheduled check: daily at 14:17 Asia/Shanghai (06:17 UTC), retried at 20:17 Asia/Shanghai (12:17 UTC). GitHub may delay the start."
          } >> "$GITHUB_STEP_SUMMARY"
